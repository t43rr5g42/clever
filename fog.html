<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    background: #000;
    overflow: hidden;
  }
  #fog {
    position: fixed;
    inset: 0;
  }
</style>
</head>
<body>
<div id="fog"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
<script>
var tries = 0;
(function wait() {
  tries++;
  if (typeof VANTA !== "undefined") {
    VANTA.FOG({
      el: "#fog",
      highlightColor: 0x444444,
      midtoneColor: 0x222222,
      lowlightColor: 0x111111,
      baseColor: 0x000000
    });
  } else if (tries < 150) {
    setTimeout(wait, 100);
  }
})();
</script>
</body>
</html>
