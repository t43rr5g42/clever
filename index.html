<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="" />
<meta name="viewport" content="initial-scale=1, width=device-width" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>

<script type="module" crossorigin src="./UqXob4bh.js"></script>
<link rel="modulepreload" crossorigin href="./chunks/CQRFESJb.js">

<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
  }

  #fog-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  #fog-bg.fog-off {
    opacity: 0;
  }

  #root {
    position: relative;
    z-index: 1;
  }

  #fog-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999999;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    color: rgba(255,255,255,0.7);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }

  #fog-toggle:hover {
    background: rgba(0,0,0,0.6);
    color: #fff;
    transform: scale(1.08);
  }

  #fog-toggle i {
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="fog-bg"></div>
  <button id="fog-toggle" title="Toggle fog">
    <i class="fa-solid fa-cloud-moon"></i>
  </button>
  <div id="root"></div>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script>
    (function() {
      const bg = document.getElementById('fog-bg');
      const btn = document.getElementById('fog-toggle');
      const icon = btn.querySelector('i');
      const STORAGE_KEY = 'zodiac_fog_enabled';

      let fogOn = localStorage.getItem(STORAGE_KEY) !== 'false';

      const vantaEffect = VANTA.FOG({
        el: "#fog-bg",
        highlightColor: 0x444444,
        midtoneColor: 0x222222,
        lowlightColor: 0x111111,
        baseColor: 0x000000
      });

      function applyState() {
        if (fogOn) {
          bg.classList.remove('fog-off');
          icon.className = 'fa-solid fa-cloud-moon';
          btn.title = 'Hide fog';
        } else {
          bg.classList.add('fog-off');
          icon.className = 'fa-regular fa-moon';
          btn.title = 'Show fog';
        }
      }

      applyState();

      btn.addEventListener('click', function() {
        fogOn = !fogOn;
        localStorage.setItem(STORAGE_KEY, fogOn);
        applyState();
      });

    })();
  </script>

</body>
</html>
